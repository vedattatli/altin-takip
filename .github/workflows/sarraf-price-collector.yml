# Altın Takip — ücretsiz bulut fiyat toplayıcısı
#
# Sürekli çalışan bir worker DEĞİLDİR. Her koşum bağımsızdır ve kimsenin
# bilgisayarının açık olması gerekmez.
#
# TEK KOŞUMDA İKİ AYRI YOL — bilinçli olarak TEK İŞ (job) içinde:
#
#   1. HTTP kaynakları (Kapalıçarşı / Türkiye geneli)
#      Sayfa ve JSON düz sunucu isteğiyle okunur, TARAYICI GEREKMEZ. Toplama
#      uygulamanın kendi zamanlanmış ucunda yapılır; runner yalnızca tetikler.
#
#   2. Ekran kaynağı (Sarraf TV Kayseri)
#      Bayi fiyatı yalnız tarayıcıda hesaplanıyor; bu yüzden Chromium açılır,
#      ekran BİR KEZ okunur ve imzalı gözlem HMAC makine ucuna gönderilir.
#
# NEDEN TEK İŞ: GitHub Actions dakikayı iş başına YUKARI YUVARLAR. İki ayrı
# iş kurmak ~70 saniyelik bir koşumu 2 dakika yerine 3 dakika olarak faturalar
# ve saatlik programda ücretsiz kotayı aşardı.
#
# Adımlar birbirini ENGELLEMEZ: HTTP kaynakları başarısız olsa da ekran
# toplanır, ekran başarısız olsa da HTTP kaynakları toplanmıştır.

name: Fiyat toplayıcı

on:
  # Elle çalıştırma: doğrulama ve acil güncelleme için.
  workflow_dispatch:
  schedule:
    # 5 dakika, GitHub'ın izin verdiği EN SIK programdır; daha sık istenemez.
    #
    # Depo public olduğu için Actions dakikaları ücretsiz ve sınırsızdır —
    # private iken saatlik program bile aylık 2.000 dakikalık kotanın
    # %70'ini yiyordu. Depo tekrar private yapılırsa bu satır saatliğe
    # döndürülmelidir, yoksa kota ilk günlerde biter.
    #
    # GitHub zamanlanmış koşumları yoğun anlarda geciktirir veya atlar; bu
    # best-effort bir programdır, garanti değildir. Gerçekten sürekli fiyat
    # için kalıcı worker (services/sarraf-screen-worker/) kullanılır.
    - cron: "*/5 * * * *"

# Aynı anda tek koşum: önceki koşum sürerken ikincisi paralel fiyat göndermesin.
concurrency:
  group: altin-price-collector
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    # Takılırsa kotayı tüketmesin. Normal koşum ~1 dakikadır.
    timeout-minutes: 6

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Bağımlılıklar
        run: npm ci --no-audit --no-fund

      # --- 1. HTTP kaynakları: tarayıcı gerektirmez, saniyeler sürer ---
      - name: Kapalıçarşı ve Türkiye geneli fiyatlarını topla
        id: http-sources
        env:
          APP_BASE_URL: ${{ secrets.ALTIN_TAKIP_APP_URL }}
          PRICE_CRON_SECRET: ${{ secrets.PRICE_CRON_SECRET }}
        run: node scripts/trigger-price-ingestion.mjs

      - name: Chromium önbelleği
        # Önceki adım başarısız olsa da ekran kaynağı denenir.
        if: always()
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium kurulumu
        if: always() && steps.chromium-cache.outputs.cache-hit != 'true'
        # YALNIZ Chromium; başka tarayıcı indirilmez.
        run: npx playwright install --with-deps chromium

      # --- 2. Ekran kaynağı: Kayseri tezgâh fiyatı yalnız DOM'da hesaplanıyor ---
      - name: Kayseri ekran fiyatını topla ve gönder
        if: always()
        env:
          APP_BASE_URL: ${{ secrets.ALTIN_TAKIP_APP_URL }}
          PRICE_SCREEN_WORKER_SECRET: ${{ secrets.PRICE_SCREEN_WORKER_SECRET }}
          PRICE_SCREEN_WORKER_ID: ${{ secrets.PRICE_SCREEN_WORKER_ID }}
          SARRAF_SCREEN_URL: ${{ secrets.SARRAF_SCREEN_URL }}
          APP_DEPLOYMENT_ENV: private-pilot
          PRICE_EXPERIMENTAL_SARRAF_SCREEN: "true"
          PRICE_EXPERIMENTAL_PRIVATE_PILOT: "true"
        run: npm run price:sarraf:collect-once

      # Not: Toplayıcı çıkış kodları
      #   0  — fiyat kabul edildi
      #   75 — geçici (kira başkasında, ekran okunamadı, kabul edilen fiyat yok)
      #   76 — CAPTCHA etkileşim istedi; ÇÖZÜLMEZ, koşum başarısız sayılır
      #   1  — yapılandırma veya beklenmeyen hata
      #
      # 75 durumunda koşum başarısız görünür ve bu KASITLIDIR: fiyat
      # gelmediğinde bunu sessizce başarı saymak yanlış olur. Uygulama zaten
      # fiyatı bayat olarak işaretler ve başka kaynağa DÜŞMEZ.
